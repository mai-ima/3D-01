<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 3 columns (catalog rail · single-model stage · inspector). Single deliberate dark look: instrument-panel chrome around a neutral photo stage. */
:root{
  --bg:#0b0e11; --surf:#11151a; --surf2:#171c22; --line:#232a32; --fg:#e8ecef; --mute:#8b96a0; --dim:#5c6670;
  --accent:#f2b01e; --accent-ink:#1a1300;
  --f-body:'Noto Sans JP',system-ui,sans-serif; --f-num:'Barlow Condensed','Noto Sans JP',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.55 var(--f-body);overflow:hidden}
button{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-columns:268px minmax(0,1fr) 344px;grid-template-rows:50px minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surf)}
.mark{display:flex;gap:3px;padding:5px 6px;background:#06080a;border-radius:6px;border:1px solid var(--line)}
.mark i{width:7px;height:7px;border-radius:50%;display:block}
header h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.05em}
header .sub{color:var(--mute);font:500 11px var(--f-mono);letter-spacing:.04em}
header .sp{flex:1}
header .kbd{font:500 10px var(--f-mono);color:var(--dim)}
kbd{font:500 10px var(--f-mono);border:1px solid #39424b;border-bottom-width:2px;border-radius:4px;padding:0 5px;color:#aeb8c1;background:#0d1115}
#rail{border-right:1px solid var(--line);background:var(--surf);overflow:auto;min-height:0}
.gh{position:sticky;top:0;z-index:1;background:var(--surf);padding:12px 14px 7px;font:500 10px var(--f-mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.item{display:grid;grid-template-columns:54px 1fr;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #161b20;padding:9px 14px;cursor:pointer;position:relative}
.item:hover{background:#151a1f}
.item.sel{background:var(--surf2)}
.item.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.item .th{width:54px;height:68px;border-radius:6px;background:#1b2127 center/cover no-repeat;border:1px solid var(--line)}
.item b{display:block;font-weight:500;font-size:12.5px;line-height:1.35}
.item small{display:block;margin-top:3px;font:400 10px var(--f-mono);color:var(--dim)}
#stage{position:relative;min-width:0;min-height:0;background:#8d949a}
#gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
.ov{position:absolute;pointer-events:none}
#title{left:18px;top:14px;color:#10161b;text-shadow:0 1px 0 #ffffff55}
#title .g{display:inline-block;font:500 10px var(--f-mono);letter-spacing:.14em;padding:2px 8px;border:1px solid #10161b66;border-radius:3px;text-transform:uppercase}
#title h2{margin:6px 0 0;font-size:21px;line-height:1.3;font-weight:700;max-width:520px}
#title.dark{color:#f1f4f6;text-shadow:0 1px 8px #000a}#title.dark .g{border-color:#ffffff66}
#nav{right:14px;top:14px;display:flex;gap:6px;pointer-events:auto}
.round{width:34px;height:34px;border-radius:50%;border:1px solid #ffffff2a;background:#0b0e11b8;backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;color:#e8ecef}
.round:hover{border-color:#ffffff77}
.round svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar{left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:8px;pointer-events:auto;max-width:calc(100% - 24px);overflow-x:auto;padding:2px}
.pill{display:flex;gap:2px;padding:3px;background:#0b0e11c4;border:1px solid #ffffff22;border-radius:10px;backdrop-filter:blur(10px);flex:none}
.pill button{background:none;border:0;border-radius:7px;padding:6px 11px;color:#c9d1d8;cursor:pointer;white-space:nowrap}
.pill button:hover{color:#fff}
.pill button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.pill.sep{padding:3px 4px}
#loading{inset:0;display:grid;place-items:center;color:#10161b;font:500 12px var(--f-mono);letter-spacing:.14em}
#loading.dark{color:#fff}
#ctl{border-left:1px solid var(--line);background:var(--surf);overflow:auto;min-height:0}
.sec{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:11px}
.lab{display:flex;justify-content:space-between;align-items:baseline;font:500 10px var(--f-mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
#desc{margin:0;color:#c3ccd3;font-size:12.5px;line-height:1.75}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.fact small{display:block;font:500 9.5px var(--f-mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.fact b{display:block;font:600 16px var(--f-num);letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
#dims{font-size:11px;color:var(--mute)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.modes button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;color:var(--mute)}
.modes button b{font-size:13px;color:var(--fg);font-weight:700}
.modes button small{font-size:10px}
.modes button:hover:not(:disabled){border-color:#46515c}
.modes button.on{border-color:var(--accent);background:#2a2208}
.modes button.on b{color:var(--accent)}
.modes button:disabled{opacity:.35;cursor:not-allowed}
.states{display:flex;flex-wrap:wrap;gap:6px}
.states button{display:flex;gap:7px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.states button i{width:9px;height:9px;border-radius:50%;flex:none;background:#444}
.states button:hover{border-color:#46515c}
.states button.on{border-color:var(--accent);background:#2a2208}
.tl{display:flex;gap:2px;height:8px}
.tl i{display:block;border-radius:2px;background:#27303a;transition:background .12s}
.tl i.on{background:var(--accent)}
.tlt{display:flex;justify-content:space-between;font:400 11px var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center}
.row input{flex:1;accent-color:var(--accent)}
.num{font:600 17px var(--f-num);min-width:3em;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 6px;cursor:pointer;color:var(--mute);display:flex;gap:7px;align-items:center;justify-content:center}
.seg button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.seg button:hover{border-color:#46515c}
.seg button.on{color:var(--fg);border-color:var(--accent);background:#2a2208}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:32px;height:18px;border-radius:9px;background:#2b333b;position:relative;flex:none;transition:background .15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#aab4bd;transition:transform .15s,background .15s}
.sw input:checked+i{background:#6b5412}.sw input:checked+i::after{transform:translateX(14px);background:var(--accent)}
.sw input:focus-visible+i,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw.off,.seg.off{opacity:.4;pointer-events:none}
#opts{display:flex;flex-direction:column;gap:10px}.opt{display:flex;flex-direction:column;gap:6px}.opt>span{font-size:11.5px;color:#c3ccd3}
.seg.sm button{padding:6px 6px;font-size:12px}
.gh0{padding:14px 14px 8px;font:700 12px var(--f-body);letter-spacing:.08em;color:var(--fg);background:#0e1216;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.gh{top:38px}.nostate{color:var(--dim);font-size:12px}
#tabs{display:none}
@media (max-width:980px){
  #app{grid-template-columns:1fr;grid-template-rows:46px 50% 44px minmax(0,1fr)}
  header .sub,header .kbd{display:none}
  #tabs{display:flex;background:var(--surf);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  #tabs button{flex:1;background:none;border:0;color:var(--mute);font-weight:500;cursor:pointer}
  #tabs button.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
  #rail,#ctl{grid-column:1;grid-row:4;border:0}
  #app[data-tab="models"] #ctl,#app[data-tab="ctl"] #rail{display:none}
  #title h2{font-size:17px}
  #nav{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app" data-tab="models">
  <header>
    <div class="mark"><i style="background:#ff4b3a"></i><i style="background:#ffc21a"></i><i style="background:#16d9a1"></i></div>
    <h1 id="vtitle">__H1__</h1><span class="sub" id="count"></span><span class="sp"></span>
    <span class="kbd"><kbd>←</kbd><kbd>→</kbd> モデル切替 &nbsp; <kbd>A</kbd><kbd>M</kbd><kbd>N</kbd> モード &nbsp; <kbd>1</kbd>–<kbd>4</kbd> 背景 &nbsp; <kbd>W</kbd> ワイヤー</span>
  </header>
  <nav id="rail" aria-label="モデル一覧"></nav>
  <main id="stage">
    <canvas id="gl" tabindex="0" aria-label="3Dビュー"></canvas>
    <div class="ov" id="title"><span class="g" id="grp"></span><h2 id="mname"></h2></div>
    <div class="ov" id="nav">
      <button class="round" id="prev" aria-label="前のモデル"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="round" id="next" aria-label="次のモデル"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="ov" id="bar">
      <div class="pill" id="views"><button data-v="all">全体</button><button data-v="lamp">灯器</button><button data-v="front">正面</button><button data-v="side">側面</button><button data-v="back">背面</button><button data-v="top">上面</button></div>
      <div class="pill" id="disp"><button data-d="shade" class="on">シェード</button><button data-d="clay">クレイ</button><button data-d="wire">ワイヤー</button></div>
      <div class="pill sep"><button id="tDims">寸法</button><button id="tSpin">回転</button></div>
    </div>
    <div class="ov" id="loading">LOADING…</div>
  </main>
  <div id="tabs"><button data-t="models" class="on">モデル</button><button data-t="ctl">操作・情報</button></div>
  <aside id="ctl">
    <div class="sec">
      <div class="lab"><span>概要</span><span id="fid"></span></div>
      <p id="desc"></p>
      <div class="facts"><div class="fact"><small>高さ</small><b id="fSize">-</b></div><div class="fact"><small>三角形</small><b id="fTris">-</b></div><div class="fact"><small>GLB</small><b id="fBytes">-</b></div></div>
      <div id="dims"></div>
    </div>
    <div class="sec nostate" id="noState" style="display:none">このモデルに点灯する現示はありません(形状のみ)。</div>
    <div class="sec" id="stateSec">
      <div class="lab"><span>制御モード</span><span><kbd>A</kbd><kbd>M</kbd><kbd>N</kbd></span></div>
      <div class="modes" id="modes">
        <button data-m="auto"><b>自動</b><small>現示を循環</small></button>
        <button data-m="manual"><b>手動</b><small>個別に選択</small></button>
        <button data-m="night"><b>夜間</b><small>点滅現示</small></button>
      </div>
      <div class="lab" style="margin-top:4px"><span>現示</span></div>
      <div class="states" id="states"></div>
      <div class="tl" id="tl"></div>
      <div class="tlt"><span id="tlName"></span><span id="tlRem"></span></div>
      <div class="row"><span class="lab">速度</span><input id="speed" type="range" min="0.5" max="4" step="0.25" value="1" aria-label="自動制御の速度"><span class="num" id="speedV">1.0×</span></div>
    </div>
    <div class="sec" id="optSec">
      <div class="lab"><span>オプション</span><span id="optHint"></span></div>
      <div id="opts"></div>
    </div>
    <div class="sec">
      <div class="lab"><span>背景</span><span><kbd>1</kbd>–<kbd>4</kbd></span></div>
      <div class="seg" id="envSeg">
        <button data-e="studio" class="on"><svg viewBox="0 0 24 24"><path d="M4 18h16M7 18l1-9h8l1 9M10 9V6h4v3"/></svg>スタジオ</button>
        <button data-e="day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>昼</button>
        <button data-e="dusk"><svg viewBox="0 0 24 24"><path d="M5 17a7 7 0 0 1 14 0M2 20h20M12 5v3M4.5 9.5l2 2M19.5 9.5l-2 2"/></svg>夕</button>
        <button data-e="night"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>夜</button>
      </div>
      <label class="sw" id="wetSw"><input type="checkbox" id="wet"><i></i>濡れた路面</label>
      <div class="lab" style="margin-top:4px"><span>軌道(線路)</span></div>
      <div class="seg" id="trackSeg"><button data-k="none" class="on">なし</button><button data-k="ballast">砂利</button><button data-k="slab">スラブ</button><button data-k="tram">併用</button></div>
      <label class="sw" id="onTrackSw"><input type="checkbox" id="onTrack"><i></i>軌道上に設置</label>
    </div>
  </aside>
</div>
