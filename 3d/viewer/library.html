<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/*__CSS__*/
/* ライブラリ: 一覧(検索・折りたたみカテゴリ・サムネイル)から選ぶ → 詳細(3D+タブ式パネル) */
#app{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr);position:relative}
.hdr .srch{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:4px;padding:0 10px;color:var(--ink)}
.hdr .srch input{flex:1;border:0;background:none;min-height:36px;outline:none;font-size:14px;min-width:0}
.hdr .srch svg{color:var(--blue)}
#gallery{grid-row:2;display:grid;grid-template-columns:272px minmax(0,1fr);min-height:0}
#tree{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding-bottom:20px}
.tn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);padding:9px 14px;min-height:44px;font-size:13.5px}
.tn.top{background:var(--blue-l);font-weight:700;color:var(--blue-d)}
.tn.sub{padding-left:36px}
.tn .n{margin-left:auto;font:600 12px var(--f-num);color:var(--mute)}
.tn.sel{background:var(--blue);color:#fff}.tn.sel .n{color:#fff}
.tn svg.i{transition:transform .15s;color:var(--blue)}.tn.sel svg.i{color:#fff}
.tg[data-open="0"] .tn.top svg.i{transform:rotate(-90deg)}
.tg[data-open="0"] .tb{display:none}
#gmain{overflow:auto;padding:16px 22px 48px;min-height:0}
#gtools{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
#gtools h2{margin:0;font-size:18px;font-weight:700}
#gtools .cnt{font:600 14px var(--f-num);color:var(--mute)}
#gtools .sp{flex:1}
#treeBtn{display:none;background:#fff;border:1.5px solid var(--blue);color:var(--blue-d);border-radius:4px;padding:6px 12px;min-height:40px;font-weight:700}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:4px;text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--blue);box-shadow:0 2px 0 var(--blue)}
.card .ph{aspect-ratio:216/272;background:#cfd4d0;position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .tx{padding:10px 12px 12px;border-top:1px solid var(--line2)}
.card b{display:block;font-size:13.5px;line-height:1.5;font-weight:600}
.card .meta{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.chip{font:600 12px var(--f-num);letter-spacing:.04em;border:1px solid var(--line);padding:0 7px;color:var(--mute);border-radius:2px}
.chip.b{border-color:var(--blue);color:var(--blue-d)}
.empty{padding:40px 0;color:var(--mute)}
#detail{grid-row:2;display:none;min-height:0}
#app[data-view="detail"] #gallery{display:none}
#app[data-view="detail"] #detail{display:grid;grid-template-columns:minmax(0,1fr) 392px}
#sheet{display:contents}
#stage{min-height:0}
#ctl{overflow:auto;background:var(--paper);border-left:1px solid var(--line);min-height:0}
#tabs{display:flex;position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;min-height:46px;font-weight:700;color:var(--mute);font-size:14px}
#tabs button.on{color:var(--blue-d);box-shadow:inset 0 -4px 0 var(--blue)}
#ctl[data-tab="info"] .plate:not([data-t="info"]),#ctl[data-tab="ctrl"] .plate:not([data-t="ctrl"]),#ctl[data-tab="view"] .plate:not([data-t="view"]){display:none}
#back{position:absolute;left:12px;top:12px;pointer-events:auto;display:flex;align-items:center;gap:6px;width:auto;padding:0 14px 0 10px;font-weight:700;font-size:13.5px;z-index:2}
#title{left:112px!important}
@media (max-width:980px){
  .hdr .srch{max-width:none}
  #gallery{grid-template-columns:minmax(0,1fr)}
  #tree{display:none;position:absolute;left:0;top:52px;bottom:0;width:min(86%,330px);z-index:8;box-shadow:6px 0 20px #0004}
  #app.tree-open #tree{display:block}
  #treeBtn{display:inline-flex;align-items:center;gap:6px}
  #gmain{padding:12px 12px 40px}
  #grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  #gtools{gap:8px}#gtools h2{font-size:16px}#sortSeg{min-width:0!important;width:100%}
  .hdr h1{display:none}.hdr .sp{display:none}.hdr .srch input::-webkit-search-cancel-button{-webkit-appearance:none}.hdr .srch{min-width:0;flex:1 1 0}.hdr .srch input{font-size:16px}
  #app[data-view="detail"] #detail{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);position:relative}
  #sheet{display:flex}
  #ctl{border:0;flex:1;min-height:0}
  #title{left:104px!important;right:100px!important}#title h2{font-size:15px}
  #back{padding:0 10px 0 6px}
}
@media (max-width:980px) and (orientation:landscape) and (max-height:560px){
  #app[data-view="detail"] #detail{grid-template-columns:minmax(0,1fr) 340px}
  #sheet{position:static;height:auto;display:flex;flex-direction:column;border-top:0;border-left:1px solid var(--line);box-shadow:none;overflow:auto}
  #grab{display:none}
}
</style>
<div id="app" data-view="grid">
  <header class="hdr"><div class="mk"></div><h1 id="vtitle">__H1__</h1>
    <label class="srch"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="search" type="search" placeholder="モデルを検索" aria-label="モデルを検索"></label>
    <span class="sp"></span>
    <div class="qs"><span>画質</span><div class="seg" id="qSeg"><button data-q="low">低</button><button data-q="high">高</button></div></div></header>
  <section id="gallery">
    <aside id="tree" aria-label="カテゴリ"></aside>
    <div id="gmain">
      <div id="gtools"><button id="treeBtn"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/></svg>カテゴリ</button><h2 id="gtitle">すべてのモデル</h2><span class="cnt" id="gcount"></span><span class="sp"></span>
        <div class="seg2" id="sortSeg" style="min-width:210px"><button data-s="cat" class="on">分類順</button><button data-s="name">名前順</button><button data-s="tris">重い順</button></div></div>
      <div id="grid"></div>
    </div>
  </section>
  <section id="detail">
    <main id="stage" class="stagewrap">
      <button class="sq ov" id="back" aria-label="一覧へ戻る"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>一覧</button>
    <!--@include _stage.html -->

    </main>
    <div id="sheet">
      <div id="grab" role="separator" aria-label="パネルの高さを変える"><i></i></div>
      <aside id="ctl" data-tab="info">
        <div id="tabs"><button data-t="info" class="on">情報</button><button data-t="ctrl">操作</button><button data-t="view">表示</button></div>
    <!--@include _ctl.html -->

      </aside>
    </div>
  </section>
</div>
