<title>信号機ラボ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: full-height stage (3D viewport) + control column; stacks on phones. Single dark look: night street instrument panel. */
:root{
  --bg:#0d1013; --panel:#13171b; --panel2:#191e23; --line:#262d34; --fg:#e8ecef; --mute:#8b96a0;
  --accent:#f2b01e; --red:#ff4332; --yellow:#ffbd14; --green:#18d9a0; --blue:#2aa6ff;
  --f-body:'Noto Sans JP',system-ui,sans-serif; --f-num:'Barlow Condensed','Noto Sans JP',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;overflow:hidden}
*{box-sizing:border-box}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 372px}
#stage{position:relative;min-height:0;min-width:0;background:#000}
#gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.title{position:absolute;left:16px;top:14px;pointer-events:none}
.title h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.04em}
.title p{margin:2px 0 0;color:#c4ccd3;font-size:11px;letter-spacing:.08em;text-shadow:0 1px 6px #000a}
.views{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.views button{font:inherit;color:var(--fg);background:#0d1013cc;border:1px solid #ffffff26;backdrop-filter:blur(6px);padding:6px 11px;border-radius:6px;cursor:pointer}
.views button:hover{border-color:#ffffff66}
.views button.on{background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:700}
.hint{position:absolute;right:14px;top:14px;color:#c4ccd3;font-size:11px;text-shadow:0 1px 6px #000a;pointer-events:none;text-align:right}
#panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-height:0;display:flex;flex-direction:column}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.lab{font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;font:inherit;color:var(--mute);background:none;border:0;padding:7px 4px;border-radius:5px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px #ffffff1c}
.seg button.on.acc{background:var(--accent);color:#1a1300;font-weight:700;box-shadow:none}
.row{display:flex;gap:10px;align-items:center}
input[type=range]{flex:1;accent-color:var(--accent)}
.num{font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.phases{display:flex;gap:2px;height:8px}
.phases i{display:block;border-radius:2px;background:#2b333b;position:relative;overflow:hidden}
.phases i.on{background:var(--accent)}
.phtxt{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.tog{display:flex;align-items:center;gap:8px;color:var(--fg);cursor:pointer;user-select:none}
.tog input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.card{padding:12px 16px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px;cursor:pointer}
.card.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.card h3{margin:0;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.card h3 b{font-family:var(--f-num);font-size:15px;color:var(--accent);font-weight:600}
.card p{margin:0;color:var(--mute);font-size:11px;line-height:1.6}
.dots{margin-left:auto;display:flex;gap:4px}
.dots span{width:9px;height:9px;border-radius:50%;background:#2a3138}
.btns{display:flex;flex-wrap:wrap;gap:5px}
.btns button{font:inherit;font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;display:flex;gap:6px;align-items:center}
.btns button i{width:8px;height:8px;border-radius:50%;display:block}
.btns button:hover{border-color:#ffffff55}
.btns button.on{border-color:var(--accent);background:#2a2208}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:54% 46%}
  #panel{border-left:0;border-top:1px solid var(--line)}
  .hint{display:none}
}
</style>

<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div class="title"><h1>信号機ラボ</h1><p>SIGNAL LAB — 5 TYPES / PBR</p></div>
    <div class="hint">ドラッグで回転 ・ ホイールでズーム ・ 信号をクリックで選択</div>
    <div class="views" id="views"></div>
  </div>
  <aside id="panel">
    <div class="sec">
      <div class="lab"><span>制御モード</span></div>
      <div class="seg" id="modeSeg">
        <button data-m="auto" class="on acc">自動</button><button data-m="manual">手動</button><button data-m="flash">夜間点滅</button>
      </div>
      <div class="phases" id="phases"></div>
      <div class="phtxt"><span id="phName">フェーズ</span><span id="phTime"></span></div>
      <div class="row"><span class="lab" style="min-width:3.4em">速度</span><input id="speed" type="range" min="0.5" max="4" step="0.25" value="1" aria-label="自動制御の速度"><span class="num" id="speedV">1.0×</span></div>
    </div>
    <div class="sec">
      <div class="lab"><span>環境</span></div>
      <div class="seg" id="timeSeg"><button data-t="day" class="on">昼</button><button data-t="dusk">夕方</button><button data-t="night">夜</button></div>
      <label class="tog"><input type="checkbox" id="wet"> 濡れた路面(雨上がり)</label>
    </div>
    <div id="cards"></div>
  </aside>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';

/* ---------- renderer ---------- */
const canvas=document.getElementById('gl'), stage=document.getElementById('stage');

composer.addPass(new OutputPass());
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}

/* ---------- textures ---------- */
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

  for(let i=0;i<n;i++){const v=Math.random()*speck|0;g.fillStyle=`rgba(${v},${v},${v},${Math.random()*.5+.1})`;g.beginPath();g.arc(Math.random()*size,Math.random()*size,Math.random()*1.6+.4,0,7);g.fill();}return c;}

    const gr=g.createRadialGradient(x,y,0,x,y,8.5);gr.addColorStop(0,'#fff');gr.addColorStop(.55,'rgba(255,255,255,.85)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(x-9,y-9,18,18);}
  return tex(c);}

  g.beginPath();g.moveTo(0,-86);g.lineTo(62,-6);g.lineTo(24,-6);g.lineTo(24,82);g.lineTo(-24,82);g.lineTo(-24,-6);g.lineTo(-62,-6);g.closePath();g.fill();

function pedTexture(kind){const c=cv(256,256),g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,256,256);

  g.beginPath();g.arc(kind==='walk'?136:128,44,21,0,7);g.fill();
  if(kind==='stand'){L(128,86,128,150);L(106,98,100,158);L(150,98,156,158);L(118,150,116,222);L(138,150,140,222);}
  else{L(130,86,124,148);L(128,100,98,148);L(130,100,164,138);L(124,148,98,222);L(124,148,156,222);}
  return tex(c);}
function radialTexture(){const c=cv(128,128),g=c.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.45)');gr.addColorStop(.6,'rgba(255,255,255,.1)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);return tex(c,{aniso:1});}

/* ---------- materials ---------- */
const grain=tex(noiseCanvas(256,'#808080',255,6000),{rep:[4,4],srgb:false});
const MAT={
  hous:new THREE.MeshPhysicalMaterial({color:0x28342e,roughness:.42,metalness:.15,clearcoat:.7,clearcoatRoughness:.3,bumpMap:grain,bumpScale:.15}),

  hood:new THREE.MeshPhysicalMaterial({color:0x0e1210,roughness:.55,metalness:.1,side:THREE.DoubleSide,clearcoat:.4}),
  rubber:new THREE.MeshStandardMaterial({color:0x0b0c0d,roughness:.9,side:THREE.DoubleSide}),
  galv:new THREE.MeshStandardMaterial({color:0xaeb4b7,roughness:.4,metalness:.88,bumpMap:grain,bumpScale:.5}),
  steel:new THREE.MeshStandardMaterial({color:0x8c9296,roughness:.3,metalness:1}),
  white:new THREE.MeshPhysicalMaterial({color:0xeeeeea,roughness:.35,clearcoat:.5}),
  red:new THREE.MeshPhysicalMaterial({color:0xb4141a,roughness:.4,clearcoat:.5}),
  yel:new THREE.MeshPhysicalMaterial({color:0xe9b50e,roughness:.45,clearcoat:.4}),
  refl:new THREE.MeshStandardMaterial({color:0xf0c415,roughness:.35,metalness:.1,emissive:0x3a2c00,emissiveIntensity:.5}),
  black:new THREE.MeshStandardMaterial({color:0x090a0b,roughness:.8}),

/* ---------- geometry helpers ---------- */
function rrShape(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.absarc(x+w-r,y+r,r,-Math.PI/2,0);s.lineTo(x+w,y+h-r);s.absarc(x+w-r,y+h-r,r,0,Math.PI/2);s.lineTo(x+r,y+h);s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI);s.lineTo(x,y+r);s.absarc(x+r,y+r,r,Math.PI,1.5*Math.PI);return s;}
function roundBox(w,h,d,r,b=.012){const dd=d-2*b;const g=new THREE.ExtrudeGeometry(rrShape(w-2*b,h-2*b,Math.max(r-b,.005)),{depth:dd,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:5,curveSegments:32});g.translate(0,0,-dd/2);return g;}
function add(parent,geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);parent.add(m);return m;}
function rod(parent,a,b,r,mat=MAT.galv,seg=24){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),seg),mat);
  m.position.copy(A).add(B).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());parent.add(m);return m;}
function bolt(parent,x,y,z,r=.014,axis='z'){const m=add(parent,new THREE.CylinderGeometry(r,r,r*.9,6),MAT.steel,x,y,z);if(axis==='z')m.rotation.x=Math.PI/2;return m;}
function pole(parent,h,r0,r1,{bands=true}={}){
  const rAt=y=>r0+(r1-r0)*y/h;
  add(parent,new THREE.CylinderGeometry(r1,r0,h,72,14),MAT.galv,0,h/2,0);
  add(parent,new THREE.CylinderGeometry(r0*1.9,r0*1.9,.03,72),MAT.galv,0,.015,0);
  add(parent,new THREE.CylinderGeometry(r0*1.04,r0*1.55,.26,72),MAT.galv,0,.16,0);
  for(let k=0;k<4;k++){const a=Math.PI/4+k*Math.PI/2;const x=Math.cos(a)*r0*1.7,z=Math.sin(a)*r0*1.7;add(parent,new THREE.CylinderGeometry(.02,.02,.045,6),MAT.steel,x,.052,z);add(parent,new THREE.CylinderGeometry(.027,.027,.018,6),MAT.steel,x,.082,z);}
  add(parent,new THREE.SphereGeometry(r1*1.12,40,16,0,Math.PI*2,0,Math.PI/2),MAT.galv,0,h,0);
  const hp=add(parent,roundBox(.085,.2,.014,.012,.004),MAT.galv,0,.75,rAt(.75)*.97);bolt(hp,0,.07,.01,.007);bolt(hp,0,-.07,.01,.007);
  if(bands)for(const y of[1.7,1.86])add(parent,new THREE.CylinderGeometry(rAt(y)+.003,rAt(y)+.003,.09,72,1,true),MAT.refl,0,y,0);
}
function mastArm(parent,H,armY,armL){
  pole(parent,H,.125,.075);
  const a=add(parent,new THREE.CylinderGeometry(.048,.075,armL,56,10),MAT.galv);a.rotation.z=-Math.PI/2;a.position.set(armL/2,armY,0);
  add(parent,new THREE.CylinderGeometry(.14,.14,.3,56),MAT.galv,0,armY,0);
  rod(parent,[0,armY-.95,0],[armL*.5,armY-.04,0],.03);rod(parent,[0,armY-.95,0],[.1,armY-.95,0],.04);
  add(parent,new THREE.SphereGeometry(.05,24,12),MAT.galv,armL,armY,0);
  const cable=new THREE.CatmullRomCurve3([new THREE.Vector3(.11,.9,.02),new THREE.Vector3(.12,armY-.1,.04),new THREE.Vector3(armL*.5,armY-.12,.06),new THREE.Vector3(armL-.3,armY-.2,.04)]);
  add(parent,new THREE.TubeGeometry(cable,120,.011,8),MAT.black);
}
/* lamps */
function domeLens(R,depth,seg=128){const pts=[];for(let i=0;i<=28;i++){const r=R*i/28;pts.push(new THREE.Vector2(r,depth*(1-(r/R)**2)));}
  const g=new THREE.LatheGeometry(pts,seg);g.rotateX(Math.PI/2);const p=g.attributes.position,uv=g.attributes.uv;for(let i=0;i<p.count;i++)uv.setXY(i,p.getX(i)/(2*R)+.5,p.getY(i)/(2*R)+.5);return g;}
function lensMaterial(dark,emissive,map){return new THREE.MeshPhysicalMaterial({color:dark,roughness:.16,clearcoat:1,clearcoatRoughness:.05,emissive,emissiveMap:map,emissiveIntensity:0,side:THREE.DoubleSide});}
const COL={red:{dark:0x2a0606,e:0xff2a18,hex:'#ff4332'},yellow:{dark:0x2e1f02,e:0xffa800,hex:'#ffbd14'},green:{dark:0x02221a,e:0x00e6a2,hex:'#18d9a0'},blue:{dark:0x021c2e,e:0x1f9bff,hex:'#2aa6ff'}};
const allLamps=[];
function makeLamp(parent,x,y,z,R,color,map,{hood=.28,gap=1.5,round=true}={}){

  const bez=new THREE.LatheGeometry([[R+.004,-.012],[R+.027,-.012],[R+.027,.008],[R+.014,.022],[R+.004,.022]].map(p=>new THREE.Vector2(...p)),96);bez.rotateX(Math.PI/2);add(g,bez,MAT.rubber);

    const ig=new THREE.CylinderGeometry(R+.029,R+.029,hood-.01,64,1,true,gap/2,Math.PI*2-gap);ig.rotateX(Math.PI/2);ig.translate(0,0,hood/2);add(g,ig,new THREE.MeshBasicMaterial({color:0x020202,side:THREE.BackSide}));}

function housing(parent,w,h,d,r,mat,x,y,z){const m=add(parent,roundBox(w,h,d,r),mat,x,y,z);
  for(let i=-2;i<=2;i++)add(m,new THREE.BoxGeometry(w*.5,.012,.02),mat,0,i*h*.14,-d/2-.008); return m;}

/* ---------- environment ---------- */
const world=new THREE.Group();scene.add(world);
const asphaltC=noiseCanvas(1024,'#3b3d40',210,40000);
{const g=asphaltC.getContext('2d');for(let i=0;i<2200;i++){g.fillStyle=`rgba(${150+Math.random()*80|0},${150+Math.random()*80|0},${150+Math.random()*80|0},.5)`;g.beginPath();g.arc(Math.random()*1024,Math.random()*1024,Math.random()*2.2+.8,0,7);g.fill();}}
const asphaltT=tex(asphaltC,{rep:[44,22]});const asphaltB=tex(asphaltC,{rep:[44,22],srgb:false});
const roadMat=new THREE.MeshPhysicalMaterial({map:asphaltT,bumpMap:asphaltB,bumpScale:1.6,roughness:.92,color:0x9a9a9a});
const road=add(world,new THREE.PlaneGeometry(140,70),roadMat,0,0,37.2);road.rotation.x=-Math.PI/2;
// sidewalk
const pc=cv(512,512),pg=pc.getContext('2d');pg.fillStyle='#6b6c70';pg.fillRect(0,0,512,512);
for(let i=0;i<30000;i++){const v=100+Math.random()*90|0;pg.fillStyle=`rgba(${v},${v},${v+3},.35)`;pg.fillRect(Math.random()*512,Math.random()*512,2,2);}
pg.strokeStyle='#4d4f53';pg.lineWidth=4;for(const p of[0,256,512]){pg.beginPath();pg.moveTo(p,0);pg.lineTo(p,512);pg.stroke();pg.beginPath();pg.moveTo(0,p);pg.lineTo(512,p);pg.stroke();}
const walkMat=new THREE.MeshStandardMaterial({map:tex(pc,{rep:[70,7]}),bumpMap:tex(pc,{rep:[70,7],srgb:false}),bumpScale:2,roughness:.85});
const walk=add(world,new THREE.BoxGeometry(140,.15,9),walkMat,0,.075,-2.3);
const curb=add(world,new THREE.BoxGeometry(140,.17,.26),new THREE.MeshStandardMaterial({color:0xa4a5a8,roughness:.8,bumpMap:grain,bumpScale:.4}),0,.085,2.33);
// tenji (tactile paving)

const PH=[
  {d:7,  A:'green', B:'red',   C:['green',['straight']],       D:'red',  n:'本線 青 / 歩行者 赤'},
  {d:3,  A:'yellow',B:'red',   C:['yellow',[]],                D:'red',  n:'本線 黄'},
  {d:1.5,A:'red',   B:'red',   C:['red',[]],                   D:'red',  n:'全赤'},
  {d:7,  A:'red',   B:'green', C:['red',['left','right']],     D:'walk', n:'交差 青 / 歩行者 青'},
  {d:3,  A:'red',   B:'yellow',C:['red',[]],                   D:'blink',n:'歩行者 青点滅'},

const PT=PH.reduce((a,p)=>a+p.d,0);

function applyAuto(){let t=clock%PT,i=0;while(t>=PH[i].d){t-=PH[i].d;i++;}const p=PH[i];
  SIGS.A.st.main=p.A;SIGS.B.st.main=p.B;SIGS.C.st.main=p.C[0];SIGS.C.st.arrows=new Set(p.C[1]);SIGS.D.st.ped=p.D;return {i,rem:p.d-t,p};}

function targets(s,t){const bl=(t%1)<.5?1:0,m=s.st.main,o={};
  if(s.kind==='veh'||s.kind==='arrow'){o.red=(m==='red'||(m==='flashR'&&bl))?1:0;o.yellow=(m==='yellow'||(m==='flashY'&&bl))?1:0;o.green=m==='green'?1:0;
    if(s.kind==='arrow')for(const k of['left','straight','right'])o[k]=s.st.arrows.has(k)?1:0;}
  else if(s.kind==='ped'){o.red=s.st.ped==='red'?1:0;o.walk=(s.st.ped==='walk'||(s.st.ped==='blink'&&bl))?1:0;}
  else{o.l1=s.st.on&&bl?1:0;o.l2=s.st.on&&!bl?1:0;}
  return o;}

document.querySelectorAll('#timeSeg button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#timeSeg button').forEach(x=>x.classList.toggle('on',x===b));applyTime(b.dataset.t);}));
$('wet').addEventListener('change',e=>{wet=e.target.checked;applyWet();});
$('speed').addEventListener('input',e=>{speed=+e.target.value;$('speedV').textContent=speed.toFixed(1)+'×';});

/* camera focus */
let tween=null;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function select(id,fly){sel=id;uiSig='';document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.dataset.id===id));
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===(id||'all')));
  if(!fly)return;let tp,pp;
  if(!id){tp=new THREE.Vector3(-.5,2.8,0);pp=new THREE.Vector3(0,4.6,Math.min(46,34+(1.4-camera.aspect)*14));}
  else{const s=SIGS[id];const f=new THREE.Vector3(s.focus[0],s.focus[1]+.15,s.focus[2]);tp=f;pp=f.clone().add(new THREE.Vector3(...s.view));if(camera.aspect<1)pp.z+=2.6;}
  tween={t:0,fp:camera.position.clone(),ft:controls.target.clone(),tp:pp,tt:tp};}
select(null,false);
/* picking */
let down=null;canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
const ray=new THREE.Raycaster();
canvas.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const r=canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),camera);
  const h=ray.intersectObjects(Object.values(SIGS).map(s=>s.g),true)[0];if(h){let o=h.object;while(o&&!o.userData.sigId)o=o.parent;if(o)select(o.userData.sigId,true);}});

/* ---------- loop ---------- */
applyTime('day');
const T0=performance.now();let last=T0;const tmp=new THREE.Vector3();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.1);last=now;const t=(now-T0)/1000;
  let info=null;
  if(mode!=='manual')clock+=dt*speed;
  if(mode==='auto')info=applyAuto();else if(mode==='flash')applyFlash();
  if(mode!=='manual'){SIGS.E.st.on=(clock%19)>=10;}
  // phase UI
  if(mode==='auto'&&info){[...phEl.children].forEach((e,i)=>e.classList.toggle('on',i===info.i));$('phName').textContent=`${info.i+1}/${PH.length} ${info.p.n}`;$('phTime').textContent=info.rem.toFixed(1)+'s';}
  else{[...phEl.children].forEach(e=>e.classList.remove('on'));$('phName').textContent=mode==='flash'?'夜間点滅(本線 黄 / 交差 赤)':'手動操作中';$('phTime').textContent='';}
  // lamps
  for(const s of Object.values(SIGS)){const tg=targets(s,t);for(const k in s.lamps)s.lamps[k].t=tg[k]||0;}
  const k=1-Math.exp(-dt*38);
  for(const L of allLamps){L.v+=(L.t-L.v)*k;L.mat.emissiveIntensity=L.v*3.4;L.glow.material.opacity=L.v*glowK;}
  for(const s of Object.values(SIGS)){let best=null;for(const kk in s.lamps)if(s.lamps[kk].v>.05&&(!best||s.lamps[kk].v>best.v))best=s.lamps[kk];
    if(best){best.g.getWorldPosition(tmp);s.light.position.copy(tmp).add(new THREE.Vector3(0,0,.9));s.light.color.set(best.color.e);s.light.intensity=best.v*7;}else s.light.intensity=0;}
  // UI sync
  let sig='';for(const s of Object.values(SIGS))sig+=JSON.stringify([s.st.main,s.st.ped,s.st.on,s.st.arrows&&[...s.st.arrows]])+'|';
  if(sig!==uiSig){uiSig=sig;document.querySelectorAll('.card').forEach(c=>{c.querySelectorAll('.btns button').forEach(b=>b.classList.toggle('on',!!b._on()));});}
  document.querySelectorAll('.card').forEach(c=>{const s=SIGS[c.dataset.id];c.querySelectorAll('.dots span').forEach(d=>{const L=s.lamps[d.dataset.k];d.style.background=L.t>.5?dotHex(d.dataset.k):'#2a3138';});});
  // camera
  if(tween){tween.t=Math.min(1,tween.t+dt/1.1);const e=ease(tween.t);camera.position.lerpVectors(tween.fp,tween.tp,e);controls.target.lerpVectors(tween.ft,tween.tt,e);if(tween.t>=1)tween=null;}
  controls.update();composer.render();}
canvas.addEventListener('pointerdown',()=>{tween=null;});canvas.addEventListener('wheel',()=>{tween=null;},{passive:true});
requestAnimationFrame(frame);
window.__ready=true;window.__api={SIGS,setMode,applyTime,select,camera,controls};
</script>
